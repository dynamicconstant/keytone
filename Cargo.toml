[workspace]
resolver = "2"
members = ["src-tauri", "crates/keyhook", "crates/keytone-core"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Harshil Nainani"]

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

# Audio code must not be painfully slow in debug builds.
[profile.dev.package."*"]
opt-level = 2
